<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신체보호대 관련 낙상 안내 | 충남대학교병원</title>
    <meta name="description" content="충남대학교병원 신체보호대 사용 시 안전 수칙 및 낙상 예방 가이드 그림 안내 페이지입니다.">
    
    <!-- Google Fonts: Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Modern Design System & Variables */
        :root {
            /* CNUH Brand Colors (Navy & Teal) */
            --cnuh-blue: #0A3B73;       /* CNUH Deep Navy */
            --cnuh-teal: #00A896;       /* CNUH Bright Teal Green */
            
            --primary: #0A3B73;
            --primary-light: rgba(10, 59, 115, 0.06);
            --primary-border: rgba(10, 59, 115, 0.12);
            
            --text-main: #0F172A;     /* Slate 900 */
            --text-sub: #334155;      /* Slate 700 */
            --text-mute: #64748B;     /* Slate 500 */
            
            --bg-page: #F8FAFC;       /* Soft clinic white */
            --bg-card: #FFFFFF;
            
            --radius-card: 24px;
            --radius-inner: 16px;
            --radius-pill: 100px;
            
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 15px -3px rgba(74, 144, 226, 0.05), 0 4px 6px -2px rgba(74, 144, 226, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            letter-spacing: -0.03em;
        }

        body {
            background-color: #E2E8F0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* App Mockup Wrapper */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-page);
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            box-shadow: 0 0 50px rgba(15, 23, 42, 0.08);
            position: relative;
            overflow: hidden;
        }

        /* Ambient background glow */
        .app-container::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -20%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0, 168, 150, 0.06) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Responsive Frame for Desktop/Tablet view */
        @media (min-width: 481px) {
            body {
                padding: 20px;
            }
            .app-container {
                min-height: 840px;
                height: 840px;
                border-radius: 48px;
                border: 12px solid #0F172A;
                box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
            }
            
            .app-container-notch {
                position: absolute;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 140px;
                height: 25px;
                background-color: #0F172A;
                border-bottom-left-radius: 16px;
                border-bottom-right-radius: 16px;
                z-index: 10;
            }
        }

        /* Navigation & Header */
        .header {
            position: relative;
            z-index: 2;
            margin-top: 12px;
            margin-bottom: 24px;
            text-align: center;
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .header-nav {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
            width: 100%;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            background-color: #FFFFFF;
            border: 1px solid rgba(10, 59, 115, 0.12);
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 700;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .back-button svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.5;
            transition: var(--transition);
        }

        .back-button:active {
            transform: scale(0.95);
            background-color: #F8FAFC;
        }

        @media (hover: hover) {
            .back-button:hover {
                background-color: var(--cnuh-blue);
                color: #FFFFFF;
                border-color: var(--cnuh-blue);
            }
            .back-button:hover svg {
                stroke: #FFFFFF;
            }
        }

        .logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border: 1px solid rgba(10, 59, 115, 0.12);
            padding: 8px 20px;
            border-radius: var(--radius-pill);
            box-shadow: 0 4px 12px rgba(10, 59, 115, 0.05);
            margin-bottom: 12px;
        }

        .logo-img {
            height: 30px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        /* Image Viewer Area */
        .image-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            margin-bottom: 24px;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .guide-pdf-img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-inner);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(10, 59, 115, 0.08);
            display: block;
        }

        /* Custom Placeholder */
        .placeholder-container {
            width: 100%;
            background-color: #FFFFFF;
            border: 2px dashed rgba(10, 59, 115, 0.15);
            border-radius: var(--radius-card);
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .placeholder-icon {
            width: 54px;
            height: 54px;
            stroke: var(--cnuh-teal);
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .placeholder-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .placeholder-text {
            font-size: 13px;
            color: var(--text-mute);
            line-height: 1.6;
        }

        .highlight-text {
            color: var(--cnuh-blue);
            font-weight: 700;
            background-color: rgba(10, 59, 115, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* Footer Section */
        .footer {
            margin-top: auto;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .home-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #FFFFFF;
            border: 1px solid rgba(10, 59, 115, 0.15);
            padding: 10px 20px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            color: var(--cnuh-blue);
            box-shadow: var(--shadow-sm);
            margin-bottom: 18px;
            transition: var(--transition);
        }

        .home-link-btn:active {
            transform: scale(0.96);
            background-color: #F8FAFC;
        }

        @media (hover: hover) {
            .home-link-btn:hover {
                background-color: var(--cnuh-blue);
                color: #FFFFFF;
                border-color: var(--cnuh-blue);
                box-shadow: 0 4px 12px rgba(10, 59, 115, 0.15);
            }
            .home-link-btn:hover .external-icon {
                color: #FFFFFF;
            }
        }

        .external-icon {
            width: 14px;
            height: 14px;
            color: var(--cnuh-blue);
            transition: var(--transition);
        }

        .copyright-box {
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            padding-top: 14px;
        }

        .copyright {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-mute);
            line-height: 1.5;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app-root">
        <div class="app-container-notch"></div>
        
        <!-- Header & Nav Section -->
        <header class="header" id="main-header">
            <div class="header-nav">
                <a href="fall_prevention.html" class="back-button" id="btn-back">
                    <svg viewBox="0 0 24 24" fill="none" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>이전으로</span>
                </a>
            </div>
            
            <div class="logo-box">
                <img src="images/cnuh_logo.png" alt="충남대학교병원 로고" class="logo-img">
            </div>
        </header>

        <!-- Main Image Viewer -->
        <div class="image-wrapper">
            <!-- Displays image, falls back to placeholder if image fails to load (e.g. before user uploads it) -->
            <img src="images/restraints_guide.png" alt="신체보호대 관련 낙상 안내 가이드" class="guide-pdf-img" onerror="this.style.display='none'; document.getElementById('placeholder-box').style.display='flex';">
            
            <div id="placeholder-box" class="placeholder-container" style="display: none;">
                <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                <h2 class="placeholder-title">안내 이미지 대기 중</h2>
                <p class="placeholder-text">
                    신체보호대 안내 이미지 파일을 등록해 주세요.<br>
                    규격에 맞는 이미지를 준비한 후, 파일명을<br>
                    <span class="highlight-text">restraints_guide.png</span> 로 저장하여<br>
                    <span class="highlight-text">images/</span> 폴더에 추가하면 자동으로 노출됩니다.
                </p>
            </div>
        </div>

        <!-- Footer Section -->
        <footer class="footer" id="main-footer">
            <a href="https://www.cnuh.co.kr/home/index.do" target="_blank" rel="noopener noreferrer" class="home-link-btn" id="btn-cnuh-home">
                <span>충남대학교병원 공식 홈페이지 바로가기</span>
                <svg class="external-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/>
                    <line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
            </a>
            <div class="copyright-box">
                <p class="copyright">본 모바일 웹페이지는 QR코드용 안심 링크로 동작합니다.<br>© CHUNGNAM NATIONAL UNIVERSITY HOSPITAL.</p>
            </div>
        </footer>

    </div>

</body>
</html>
