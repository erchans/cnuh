<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신체보호대 관련 낙상 안내 | 충남대학교병원</title>
    <meta name="description" content="충남대학교병원 신체보호대 사용 시 안전 수칙 및 낙상 예방 가이드 그림 안내 페이지입니다.">
    
    <!-- Google Fonts: Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Modern Design System & Variables */
        :root {
            /* CNUH Brand Colors (Navy & Teal) */
            --cnuh-blue: #0A3B73;       /* CNUH Deep Navy */
            --cnuh-teal: #00A896;       /* CNUH Bright Teal Green */
            
            --primary: #0A3B73;
            --primary-light: rgba(10, 59, 115, 0.06);
            --primary-border: rgba(10, 59, 115, 0.12);
            
            --text-main: #0F172A;     /* Slate 900 */
            --text-sub: #334155;      /* Slate 700 */
            --text-mute: #64748B;     /* Slate 500 */
            
            --bg-page: #F8FAFC;       /* Soft clinic white */
            --bg-card: #FFFFFF;
            
            --radius-card: 24px;
            --radius-inner: 16px;
            --radius-pill: 100px;
            
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 15px -3px rgba(74, 144, 226, 0.05), 0 4px 6px -2px rgba(74, 144, 226, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            letter-spacing: -0.03em;
        }

        body {
            background-color: #E2E8F0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* App Mockup Wrapper */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-page);
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            box-shadow: 0 0 50px rgba(15, 23, 42, 0.08);
            position: relative;
            overflow: hidden;
        }

        /* Ambient background glow */
        .app-container::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -20%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0, 168, 150, 0.06) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Responsive Frame for Desktop/Tablet view */
        @media (min-width: 481px) {
            body {
                padding: 20px;
            }
            .app-container {
                min-height: 840px;
                height: 840px;
                border-radius: 48px;
                border: 12px solid #0F172A;
                box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
            }
            
            .app-container-notch {
                position: absolute;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 140px;
                height: 25px;
                background-color: #0F172A;
                border-bottom-left-radius: 16px;
                border-bottom-right-radius: 16px;
                z-index: 10;
            }
        }

        /* Navigation & Header */
        .header {
            position: relative;
            z-index: 2;
            margin-top: 12px;
            margin-bottom: 16px;
            text-align: center;
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .header-nav {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
            width: 100%;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            background-color: #FFFFFF;
            border: 1px solid rgba(10, 59, 115, 0.12);
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 700;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .back-button svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.5;
            transition: var(--transition);
        }

        .back-button:active {
            transform: scale(0.95);
            background-color: #F8FAFC;
        }

        @media (hover: hover) {
            .back-button:hover {
                background-color: var(--cnuh-blue);
                color: #FFFFFF;
                border-color: var(--cnuh-blue);
            }
            .back-button:hover svg {
                stroke: #FFFFFF;
            }
        }

        .logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border: 1px solid rgba(10, 59, 115, 0.12);
            padding: 8px 20px;
            border-radius: var(--radius-pill);
            box-shadow: 0 4px 12px rgba(10, 59, 115, 0.05);
            margin-bottom: 4px;
        }

        .logo-img {
            height: 30px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        /* Image Slider Wrapper */
        .slider-container {
            position: relative;
            z-index: 2;
            width: 100%;
            overflow: hidden;
            border-radius: var(--radius-inner);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(10, 59, 115, 0.08);
            background-color: #FFFFFF;
            margin-bottom: 16px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            min-height: 420px;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .slider-wrapper {
            display: flex;
            width: 500%; /* 5 pages */
            height: 100%;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide {
            width: 20%;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            user-select: none;
        }

        .guide-pdf-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            display: block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        /* Slider Controls */
        .slider-controls {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 24px;
            background-color: #FFFFFF;
            padding: 12px 18px;
            border-radius: 50px;
            border: 1px solid rgba(10, 59, 115, 0.08);
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .slider-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--cnuh-blue);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            transition: var(--transition);
        }

        .slider-btn svg {
            width: 16px;
            height: 16px;
        }

        .slider-btn:active {
            background-color: rgba(10, 59, 115, 0.06);
            transform: scale(0.95);
        }

        .slider-btn:disabled {
            color: var(--text-mute);
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        .slider-dots {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #E2E8F0;
            transition: var(--transition);
        }

        .dot.active {
            background-color: var(--cnuh-teal);
            transform: scale(1.2);
            width: 14px;
            border-radius: 4px;
        }

        /* Footer Section */
        .footer {
            margin-top: auto;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .home-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #FFFFFF;
            border: 1px solid rgba(10, 59, 115, 0.15);
            padding: 10px 20px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            color: var(--cnuh-blue);
            box-shadow: var(--shadow-sm);
            margin-bottom: 18px;
            transition: var(--transition);
        }

        .home-link-btn:active {
            transform: scale(0.96);
            background-color: #F8FAFC;
        }

        @media (hover: hover) {
            .home-link-btn:hover {
                background-color: var(--cnuh-blue);
                color: #FFFFFF;
                border-color: var(--cnuh-blue);
                box-shadow: 0 4px 12px rgba(10, 59, 115, 0.15);
            }
            .home-link-btn:hover .external-icon {
                color: #FFFFFF;
            }
        }

        .external-icon {
            width: 14px;
            height: 14px;
            color: var(--cnuh-blue);
            transition: var(--transition);
        }

        .copyright-box {
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            padding-top: 14px;
        }

        .copyright {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-mute);
            line-height: 1.5;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app-root">
        <div class="app-container-notch"></div>
        
        <!-- Header & Nav Section -->
        <header class="header" id="main-header">
            <div class="header-nav">
                <a href="fall_prevention.html" class="back-button" id="btn-back">
                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>이전으로</span>
                </a>
            </div>
            
            <div class="logo-box">
                <img src="images/cnuh_logo.png" alt="충남대학교병원 로고" class="logo-img">
            </div>
        </header>

        <!-- Main Image Slider -->
        <div class="slider-container">
            <div class="slider-wrapper" id="slider-wrapper">
                <div class="slide"><img src="images/restraints_1.jpg" alt="신체보호대 가이드 1" class="guide-pdf-img"></div>
                <div class="slide"><img src="images/restraints_2.jpg" alt="신체보호대 가이드 2" class="guide-pdf-img"></div>
                <div class="slide"><img src="images/restraints_3.jpg" alt="신체보호대 가이드 3" class="guide-pdf-img"></div>
                <div class="slide"><img src="images/restraints_4.jpg" alt="신체보호대 가이드 4" class="guide-pdf-img"></div>
                <div class="slide"><img src="images/restraints_5.jpg" alt="신체보호대 가이드 5" class="guide-pdf-img"></div>
            </div>
        </div>

        <!-- Slider Controls -->
        <div class="slider-controls">
            <button class="slider-btn" id="prev-btn" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>이전</span>
            </button>
            
            <div class="slider-dots" id="slider-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            
            <button class="slider-btn" id="next-btn">
                <span>다음</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

        <!-- Footer Section -->
        <footer class="footer" id="main-footer">
            <a href="https://www.cnuh.co.kr/home/index.do" target="_blank" rel="noopener noreferrer" class="home-link-btn" id="btn-cnuh-home">
                <span>충남대학교병원 공식 홈페이지 바로가기</span>
                <svg class="external-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/>
                    <line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
            </a>
            <div class="copyright-box">
                <p class="copyright">본 모바일 웹페이지는 QR코드용 안심 링크로 동작합니다.<br>© CHUNGNAM NATIONAL UNIVERSITY HOSPITAL.</p>
            </div>
        </footer>

    </div>

    <!-- Carousel Controller JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const wrapper = document.getElementById('slider-wrapper');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const dots = document.querySelectorAll('.dot');
            let currentSlide = 0;
            const totalSlides = 5;

            function updateSlider() {
                // Perform the slide transition (x axis offset by percentage)
                wrapper.style.transform = `translateX(-${currentSlide * 20}%)`;
                
                // Disable previous button on first slide
                prevBtn.disabled = currentSlide === 0;
                
                // Update active indicator dot
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentSlide);
                });

                // Change Next text to "완료" (Done) on the last slide
                if (currentSlide === totalSlides - 1) {
                    nextBtn.innerHTML = `
                        <span>완료</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    `;
                } else {
                    nextBtn.innerHTML = `
                        <span>다음</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    `;
                }
            }

            prevBtn.addEventListener('click', () => {
                if (currentSlide > 0) {
                    currentSlide--;
                    updateSlider();
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentSlide < totalSlides - 1) {
                    currentSlide++;
                    updateSlider();
                } else {
                    // Redirect back to fall prevention index when complete
                    window.location.href = 'fall_prevention.html';
                }
            });

            // Touch event handling for mobile swipe gesture support
            let startX = 0;
            let endX = 0;
            
            wrapper.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            }, { passive: true });
            
            wrapper.addEventListener('touchend', (e) => {
                endX = e.changedTouches[0].clientX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const threshold = 55; // swipe minimum distance in pixels
                if (startX - endX > threshold) {
                    // Swiped left -> Show next slide
                    if (currentSlide < totalSlides - 1) {
                        currentSlide++;
                        updateSlider();
                    }
                } else if (endX - startX > threshold) {
                    // Swiped right -> Show previous slide
                    if (currentSlide > 0) {
                        currentSlide--;
                        updateSlider();
                    }
                }
            }
        });
    </script>
</body>
</html>
