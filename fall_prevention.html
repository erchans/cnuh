<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>충남대학교병원 병원 낙상예방 안내 | 모바일 가이드</title>
    <meta name="description" content="충남대학교병원을 찾아주신 환자 및 보호자를 위한 병상 낙상예방 모바일 가이드라인입니다. 낙상예방 안내 동영상과 신체보호대 안전 관리 안내를 확인하세요.">
    
    <!-- Google Fonts: Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Modern Design System & Variables */
        :root {
            /* CNUH Brand Colors (Navy & Teal) */
            --cnuh-blue: #0A3B73;       /* CNUH Deep Navy */
            --cnuh-teal: #00A896;       /* CNUH Bright Teal Green */
            
            --primary: #0A3B73;
            --primary-light: rgba(10, 59, 115, 0.06);
            --primary-border: rgba(10, 59, 115, 0.12);
            
            --teal: #00A896;
            --teal-light: rgba(0, 168, 150, 0.06);
            --teal-border: rgba(0, 168, 150, 0.12);
            
            --purple: #8B5CF6;
            --purple-light: rgba(139, 92, 246, 0.06);
            --purple-border: rgba(139, 92, 246, 0.12);
            
            --text-main: #0F172A;     /* Slate 900 */
            --text-sub: #334155;      /* Slate 700 */
            --text-mute: #64748B;     /* Slate 500 */
            
            --bg-page: #F8FAFC;       /* Soft clinic white */
            --bg-card: #FFFFFF;
            
            --radius-card: 24px;
            --radius-inner: 16px;
            --radius-pill: 100px;
            
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 15px -3px rgba(74, 144, 226, 0.05), 0 4px 6px -2px rgba(74, 144, 226, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            letter-spacing: -0.03em;
        }

        body {
            background-color: #E2E8F0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* App Mockup Wrapper (Mobile-first viewport container) */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-page);
            display: flex;
            flex-direction: column;
            padding: 30px 24px;
            box-shadow: 0 0 50px rgba(15, 23, 42, 0.08);
            position: relative;
            overflow: hidden;
        }

        /* Ambient background glow elements for premium detail */
        .app-container::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -20%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0, 168, 150, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .app-container::after {
            content: '';
            position: absolute;
            bottom: 5%;
            left: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(10, 59, 115, 0.06) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Responsive Frame for Desktop/Tablet view */
        @media (min-width: 481px) {
            body {
                padding: 20px;
            }
            .app-container {
                min-height: 840px;
                height: 840px;
                border-radius: 48px;
                border: 12px solid #0F172A;
                box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
            }
            
            /* Camera Notch for iPhone frame look */
            .app-container-notch {
                position: absolute;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 140px;
                height: 25px;
                background-color: #0F172A;
                border-bottom-left-radius: 16px;
                border-bottom-right-radius: 16px;
                z-index: 10;
            }
        }

        /* Header UI Block */
        .header {
            position: relative;
            z-index: 2;
            margin-top: 12px;
            margin-bottom: 28px;
            text-align: center;
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Logo badge */
        .logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border: 1px solid rgba(10, 59, 115, 0.12);
            padding: 8px 20px;
            border-radius: var(--radius-pill);
            box-shadow: 0 4px 12px rgba(10, 59, 115, 0.05);
            margin-bottom: 22px;
        }

        .logo-img {
            height: 30px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .subtitle-box {
            background-color: rgba(10, 59, 115, 0.04);
            border-radius: 12px;
            padding: 8px 12px;
            display: inline-block;
        }

        .subtitle {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-sub);
            line-height: 1.4;
        }

        /* Cards Layout */
        .menu-list {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-grow: 1;
            justify-content: flex-start;
        }

        /* Detailed Card UI styling */
        .menu-card {
            display: flex;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: var(--radius-card);
            padding: 22px 20px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
            transition: var(--transition);
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.2) 100%);
            z-index: -1;
        }

        .menu-card:active {
            transform: scale(0.96) translateY(2px) !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04) !important;
        }

        /* Card themes */
        .card-teal {
            border-left: 6px solid var(--cnuh-teal);
            box-shadow: 0 10px 20px -8px rgba(0, 168, 150, 0.12);
        }
        .card-purple {
            border-left: 6px solid var(--purple);
            box-shadow: 0 10px 20px -8px rgba(139, 92, 246, 0.12);
        }

        @media (hover: hover) {
            .menu-card:hover {
                transform: translateY(-4px);
                border-color: rgba(10, 59, 115, 0.15);
            }
            .card-teal:hover { box-shadow: 0 14px 28px -4px rgba(0, 168, 150, 0.2); }
            .card-purple:hover { box-shadow: 0 14px 28px -4px rgba(139, 92, 246, 0.2); }
            
            .menu-card:hover .arrow-circle {
                transform: translateX(4px);
                background-color: var(--cnuh-blue);
                color: #FFFFFF;
            }
        }

        /* Card Icon design */
        .icon-container {
            width: 62px;
            height: 62px;
            border-radius: var(--radius-inner);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 18px;
            flex-shrink: 0;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 4px 10px rgba(0, 0, 0, 0.04);
        }

        .icon-teal {
            background: radial-gradient(circle at center, #FFFFFF 0%, var(--teal-light) 120%);
            border: 1px solid var(--teal-border);
        }
        .icon-purple {
            background: radial-gradient(circle at center, #FFFFFF 0%, var(--purple-light) 120%);
            border: 1px solid var(--purple-border);
        }

        .card-icon-img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            border-radius: 10px;
        }

        /* Card Textual structure */
        .card-details {
            flex-grow: 1;
            text-align: left;
            padding-right: 8px;
        }

        .card-badge {
            display: inline-flex;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            letter-spacing: 0;
        }

        .badge-teal { background-color: var(--teal-light); color: var(--cnuh-teal); }
        .badge-purple { background-color: var(--purple-light); color: var(--purple); }

        .card-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
            line-height: 1.35;
        }

        .card-desc {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-mute);
            line-height: 1.4;
        }

        .arrow-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #F1F5F9;
            color: var(--text-mute);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .arrow-svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.5;
        }

        .card-teal:hover .arrow-circle { background-color: var(--cnuh-teal); color: #FFFFFF; }
        .card-purple:hover .arrow-circle { background-color: var(--purple); color: #FFFFFF; }

        /* Footer */
        .footer {
            margin-top: auto;
            padding-top: 36px;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .home-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #FFFFFF;
            border: 1px solid rgba(10, 59, 115, 0.15);
            padding: 10px 20px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            color: var(--cnuh-blue);
            box-shadow: var(--shadow-sm);
            margin-bottom: 18px;
            transition: var(--transition);
        }

        .home-link-btn:active {
            transform: scale(0.96);
            background-color: #F8FAFC;
        }

        @media (hover: hover) {
            .home-link-btn:hover {
                background-color: var(--cnuh-blue);
                color: #FFFFFF;
                border-color: var(--cnuh-blue);
                box-shadow: 0 4px 12px rgba(10, 59, 115, 0.15);
            }
            .home-link-btn:hover .external-icon {
                color: #FFFFFF;
            }
        }

        .external-icon {
            width: 14px;
            height: 14px;
            color: var(--cnuh-blue);
            transition: var(--transition);
        }

        .copyright-box {
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            padding-top: 14px;
        }

        .copyright {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-mute);
            line-height: 1.5;
        }

        /* Staggered load delays */
        .menu-card:nth-child(1) { animation-delay: 0.15s; }
        .menu-card:nth-child(2) { animation-delay: 0.3s; }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app-root">
        <div class="app-container-notch"></div>
        
        <!-- Header Section -->
        <header class="header" id="main-header">
            <div class="logo-box">
                <img src="images/cnuh_logo.png" alt="충남대학교병원 로고" class="logo-img">
            </div>
            
            <div class="subtitle-box">
                <p class="subtitle">확인하시려는 안내 항목을 선택해주세요.</p>
            </div>
        </header>

        <!-- Main Cards List -->
        <main class="menu-list">
            
            <!-- Card 1: 낙상예방 안내 동영상 -->
            <a href="https://drive.google.com/file/d/1Crm0pvAQYt-9dtN_EJtrkQOogJK68R7F/view" target="_blank" rel="noopener noreferrer" class="menu-card card-teal" id="btn-fall-video">
                <div class="icon-container icon-teal">
                    <img src="images/fall_video.png" alt="낙상예방 안내 동영상 아이콘" class="card-icon-img">
                </div>
                <div class="card-details">
                    <span class="card-badge badge-teal">교육 동영상</span>
                    <h2 class="card-title">낙상예방 안내 동영상</h2>
                    <p class="card-desc">영상을 통해 배우는 올바른 낙상 예방 수칙</p>
                </div>
                <div class="arrow-circle">
                    <svg class="arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </a>

            <!-- Card 2: 신체보호대 관련 낙상 안내 -->
            <a href="restraints_guide.html" class="menu-card card-purple" id="btn-restraints-guide">
                <div class="icon-container icon-purple">
                    <img src="images/restraints_icon.png" alt="신체보호대 관련 낙상 안내 아이콘" class="card-icon-img">
                </div>
                <div class="card-details">
                    <span class="card-badge badge-purple">그림 안내</span>
                    <h2 class="card-title">신체보호대 관련 낙상 안내</h2>
                    <p class="card-desc">신체보호대 사용 시 안전 수칙 및 예방 가이드</p>
                </div>
                <div class="arrow-circle">
                    <svg class="arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </a>

        </main>

        <!-- Footer Section -->
        <footer class="footer" id="main-footer">
            <a href="https://www.cnuh.co.kr/home/index.do" target="_blank" rel="noopener noreferrer" class="home-link-btn" id="btn-cnuh-home">
                <span>충남대학교병원 공식 홈페이지 바로가기</span>
                <svg class="external-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/>
                    <line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
            </a>
            <div class="copyright-box">
                <p class="copyright">본 모바일 웹페이지는 QR코드용 안심 링크로 동작합니다.<br>© CHUNGNAM NATIONAL UNIVERSITY HOSPITAL.</p>
            </div>
        </footer>

    </div>

</body>
</html>
